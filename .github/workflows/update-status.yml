name: Update Online Status

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate time since last commit
        id: status
        run: |
          # Ambil timestamp commit terakhir
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DIFF_SECONDS=$((NOW - LAST_COMMIT))
          DIFF_HOURS=$((DIFF_SECONDS / 3600))
          DIFF_DAYS=$((DIFF_SECONDS / 86400))
          DIFF_WEEKS=$((DIFF_DAYS / 7))
          DIFF_MONTHS=$((DIFF_DAYS / 30))
          DIFF_YEARS=$((DIFF_DAYS / 365))
          
          # Tentukan status berdasarkan waktu
          if [ $DIFF_HOURS -lt 24 ]; then
            # Hari ini
            STATUS="Today"
            COLOR="28A745"
            EMOJI="🟢"
          elif [ $DIFF_DAYS -eq 1 ]; then
            # Kemarin
            STATUS="Yesterday"
            COLOR="FFA500"
            EMOJI="🟡"
          elif [ $DIFF_DAYS -lt 7 ]; then
            # Nama hari (Monday, Tuesday, dll)
            DAY_OF_WEEK=$(date -d "@$LAST_COMMIT" +%A)
            STATUS="$DAY_OF_WEEK"
            COLOR="FFA500"
            EMOJI="🟡"
          elif [ $DIFF_WEEKS -eq 1 ]; then
            # Minggu lalu
            STATUS="Last_week"
            COLOR="FF8C00"
            EMOJI="🟠"
          elif [ $DIFF_WEEKS -lt 4 ]; then
            # X minggu lalu
            STATUS="${DIFF_WEEKS}_weeks_ago"
            COLOR="FF8C00"
            EMOJI="🟠"
          elif [ $DIFF_MONTHS -eq 1 ]; then
            # Bulan lalu
            STATUS="Last_month"
            COLOR="FF6347"
            EMOJI="🟠"
          elif [ $DIFF_MONTHS -lt 12 ]; then
            # X bulan lalu
            STATUS="${DIFF_MONTHS}_months_ago"
            COLOR="FF6347"
            EMOJI="🟠"
          elif [ $DIFF_YEARS -eq 1 ]; then
            # Tahun lalu
            STATUS="Last_year"
            COLOR="DC3545"
            EMOJI="🔴"
          else
            # X tahun lalu
            STATUS="${DIFF_YEARS}_years_ago"
            COLOR="DC3545"
            EMOJI="🔴"
          fi
          
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
          
          echo "📊 Status: $EMOJI $STATUS"
          echo "🎨 Color: #$COLOR"
          echo "⏰ Last commit: ${DIFF_DAYS} days ago"

      - name: Update README.md
        run: |
          # Replace status badge di README.md
          sed -i -E "s|STATUS-[^-]*-[^?]*\?style=for-the-badge\&logo=github|STATUS-${{ steps.status.outputs.status }}-${{ steps.status.outputs.color }}?style=for-the-badge\&logo=github|g" README.md
          
          echo "✅ README.md updated"
          grep "STATUS-" README.md | head -1

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet README.md; then
            echo "ℹ️  No changes to commit"
          else
            git add README.md
            git commit -m "🤖 Auto-update status: ${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.status }}"
            git push
            echo "✅ Changes pushed successfully"
          fi
