name: Update Online Status

on:
  schedule:
    - cron: '0 * * * *'  # Setiap jam
  workflow_dispatch:  # Bisa dijalankan manual

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check last activity and update status
        id: activity
        run: |
          # Get last commit timestamp
          LAST_COMMIT=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          NOW=$(date +%s)
          DIFF_HOURS=$(( (NOW - LAST_COMMIT) / 3600 ))
          
          # Determine status and color
          if [ $DIFF_HOURS -lt 2 ]; then
            STATUS="Online_🟢"
            COLOR="28A745"
            BADGE_TEXT="Currently_Coding"
          elif [ $DIFF_HOURS -lt 24 ]; then
            STATUS="Recently_Active_🟡"
            COLOR="FFA500"
            BADGE_TEXT="Last_Active_${DIFF_HOURS}h_ago"
          else
            STATUS="Offline_🔴"
            COLOR="DC3545"
            BADGE_TEXT="Last_Active_${DIFF_HOURS}h_ago"
          fi
          
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "badge_text=$BADGE_TEXT" >> $GITHUB_OUTPUT
          
          # Update README.md
          sed -i "s|STATUS-[^\?]*\?style|STATUS-${BADGE_TEXT}-${COLOR}?style|g" README.md
          
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "🤖 Update status: $STATUS"
            git push
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Show status
        run: |
          echo "Status: ${{ steps.activity.outputs.status }}"
          echo "Color: ${{ steps.activity.outputs.color }}"
          echo "Badge: ${{ steps.activity.outputs.badge_text }}"
          echo "Updated: ${{ steps.activity.outputs.updated }}"
