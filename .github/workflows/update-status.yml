name: Update Online Status

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest
    # Skip workflow jika commit berasal dari github-actions bot (mencegah infinite loop)
    if: github.actor != 'github-actions[bot]'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate time since last commit
        id: status
        run: |
          # Ambil timestamp commit terakhir
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DIFF_SECONDS=$((NOW - LAST_COMMIT))
          DIFF_HOURS=$((DIFF_SECONDS / 3600))
          DIFF_DAYS=$((DIFF_HOURS / 24))
          
          # Tentukan status berdasarkan waktu
          if [ $DIFF_HOURS -lt 2 ]; then
            STATUS="Online"
            COLOR="28A745"
            EMOJI="🟢"
            DESC="Currently_Coding"
          elif [ $DIFF_HOURS -lt 24 ]; then
            STATUS="Active_${DIFF_HOURS}h_ago"
            COLOR="FFA500"
            EMOJI="🟡"
            DESC="Recently_Active"
          elif [ $DIFF_DAYS -lt 7 ]; then
            STATUS="Offline_${DIFF_DAYS}d_ago"
            COLOR="DC3545"
            EMOJI="🔴"
            DESC="Last_Seen_${DIFF_DAYS}d_Ago"
          else
            STATUS="Offline_${DIFF_DAYS}d_ago"
            COLOR="8B0000"
            EMOJI="⚫"
            DESC="Inactive_${DIFF_DAYS}d"
          fi
          
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
          echo "desc=$DESC" >> $GITHUB_OUTPUT
          
          echo "📊 Status: $EMOJI $STATUS"
          echo "🎨 Color: #$COLOR"
          echo "⏰ Last commit: ${DIFF_HOURS}h ago"

      - name: Update README.md
        run: |
          # Replace status badge di README.md
          # Pattern: STATUS-[anything]-[color]?style=for-the-badge&logo=github
          sed -i -E "s|STATUS-[^-]*-[^?]*\?style=for-the-badge\&logo=github|STATUS-${{ steps.status.outputs.status }}-${{ steps.status.outputs.color }}?style=for-the-badge\&logo=github|g" README.md
          
          echo "✅ README.md updated"
          cat README.md | grep "STATUS-" | head -1

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Cek apakah ada perubahan
          if git diff --quiet README.md; then
            echo "ℹ️  No changes to commit"
          else
            git add README.md
            git commit -m "🤖 Auto-update status: ${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.status }}"
            git push
            echo "✅ Changes pushed successfully"
          fi
